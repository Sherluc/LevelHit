<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Level Hit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #111111;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .hello {
            font-size: 120px;
        }

        .text {
            font-size: 64px;
        }

        .dots {
            font-size: 64px;
            letter-spacing: 10px;
        }

        .dots span {
            animation: blink 1.4s infinite both;
        }

        .dots span:nth-child(1) {
            animation-delay: 0s;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0% {
                opacity: 0.2;
            }
            20% {
                opacity: 1;
            }
            100% {
                opacity: 0.2;
            }
        }
    </style>
</head>

<body>
    <div class="hello">Level Hit</div>
    <div class="text">Coming soon<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
</body>

</html>
