<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Level Hit</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        html {
            scroll-behavior: smooth
        }

        body {
            background: linear-gradient(135deg, #ffffff, #f3e4cf);
            color: #000;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            z-index: 1000;
            transition: .4s
        }

        header.hide {
            transform: translateY(-100%)
        }

        .header-buttons {
            display: flex;
            gap: 15px;
            align-items: center
        }

        .circle-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #000;
            background: transparent;
            cursor: pointer;
            position: relative;
            transition: .3s
        }

        .circle-btn:hover {
            background: rgba(0, 0, 0, .1)
        }

        .lang-container {
            position: relative
        }

        .lang-dropdown {
            position: absolute;
            top: 60px;
            right: 0;
            background: rgba(255, 255, 255, .85);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 40px;
            border: 2px solid #000;
            display: none;
            flex-direction: column;
            gap: 10px
        }

        .lang-dropdown button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px
        }

        .title {
            background-color: transparent;
            color: #000;
            border: none;
            padding: 12px 30px;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
        }

        .text {
            font-size: 64px;
        }

        .dots {
            font-size: 64px;
            letter-spacing: 10px;
        }

        .dots span {
            animation: blink 1.4s infinite both;
        }

        .dots span:nth-child(1) {
            animation-delay: 0s;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0% {
                opacity: 0.2;
            }

            20% {
                opacity: 1;
            }

            100% {
                opacity: 0.2;
            }
        }

        .section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            gap: 30px;
            position: relative
        }

        .btn-orange {
            background: orange;
            color: #fff;
            border: none;
            padding: 15px 35px;
            font-size: 16px;
            border-radius: 30px;
            cursor: pointer;
            transition: .3s;
            animation: glow 1.5s infinite alternate
        }

        .btn-orange:hover {
            background: #cc7000
        }

        .scroll-btn {
            position: absolute;
            right: 30px;
            bottom: 30px;
            background: orange;
            border: none;
            color: #fff;
            padding: 12px 22px;
            border-radius: 25px;
            cursor: pointer;
            animation: glow 1.5s infinite alternate;
            transition: .3s
        }

        .scroll-btn:hover {
            background: #cc7000
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 5px orange
            }

            to {
                box-shadow: 0 0 25px orange
            }
        }

        footer {
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative
        }

        footer a {
            margin: 10px;
            text-decoration: none;
            color: rgba(0, 0, 0, .6);
            transition: .3s
        }

        footer a:hover {
            color: #000
        }

        @media(max-width:768px) {
            .btn-orange {
                width: 100%;
                max-width: 250px
            }
        }
    </style>
</head>

<body>
    <header id="mainHeader">
        <a href="index.html">
            <button class="title">Level Hit</button>
        </a>
        <div class="header-buttons">
            <div class="lang-container">
                <button class="circle-btn" onclick="toggleLang()" id="currentLang">FR</button>
                <div class="lang-dropdown" id="langMenu">
                    <button onclick="setLanguage('fr')">Français</button>
                    <button onclick="setLanguage('en')">English</button>
                </div>
            </div>
        </div>
    </header>

    <section class="section" id="section1">
        <h1 data-i18n="welcome">Bienvenue</h1>
        <button class="scroll-btn" onclick="scrollToSection(2)">↓</button>
    </section>

    <section class="section" id="section2">
        <div class="text" data-i18n="text">Bientôt disponible</div><span
            class="dots"><span>.</span><span>.</span><span>.</span></span></div>
        <a href="page1.html"><button class="btn-orange" data-i18n="goPage1">Aller au premier jeu</button></a>
        <button class="scroll-btn" onclick="scrollToSection(3)">↓</button>
    </section>

    <footer id="section3">
        <a href="mentions-legales.html" data-i18n="legal">Mentions légales</a>
        <a href="politique-confidentialite.html" data-i18n="privacy">Politique de confidentialité</a>
        <button class="scroll-btn" onclick="scrollToSection(1); showHeader();">↑</button>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
